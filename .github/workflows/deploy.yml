name: build-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (ghcr)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/viniaguirre/hunter:latest
          # Carimba o commit na imagem pra /api/health dizer qual versão está no
          # ar — assim dá pra confirmar se o redeploy pegou a build nova.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Avisar o Portainer pra atualizar
        continue-on-error: true
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS --max-time 30 -X POST "$HOOK" \
              && echo "Redeploy disparado no Portainer." \
              || echo "Webhook falhou (Portainer fora do ar?) — imagem já está no ghcr.io, redeploy manual no Portainer."
          else
            echo "PORTAINER_WEBHOOK ainda nao definido — pulei o redeploy (configure o segredo)."
          fi
